<style>
  :root{
    --ink:#1A1D29;
    --paper:#F7F5F0;
    --paper-raised:#FFFFFF;
    --paper-dim:#EDEAE2;
    --line:#D8D3C6;
    --line-strong:#B5AE9C;
    --stamp-orange:#E8622C;
    --stamp-orange-dark:#B8481C;
    --stamp-green:#2D6E4E;
    --stamp-green-dark:#1E4D36;
    --stamp-red:#C9402F;
    --stamp-red-dark:#992F22;
    --muted:#9A9486;
    --muted-dark:#6B6759;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding-bottom:90px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* Header */
  .topbar{
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:40;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand-logo{
    width:34px;height:34px;
    object-fit:contain;
    background:#fff;
    border-radius:8px;
    padding:3px;
    flex-shrink:0;
  }
  .topbar .brand-mark{
    width:30px;height:30px;
    border:1.5px solid var(--stamp-orange);
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;
    color:var(--stamp-orange);
    transform:rotate(-4deg);
    flex-shrink:0;
  }
  .topbar .title{font-size:15px;font-weight:600;letter-spacing:0.2px;}
  .topbar .subtitle{font-size:11px;color:#9A9486;font-family:'JetBrains Mono',monospace;margin-top:1px;}
  .topbar .user-pill{
    font-size:11px;
    color:var(--paper);
    background:rgba(255,255,255,0.08);
    border:0.5px solid rgba(255,255,255,0.2);
    padding:5px 10px;
    border-radius:20px;
    font-family:'JetBrains Mono',monospace;
    display:flex;align-items:center;gap:6px;
    cursor:pointer;
  }

  .content{padding:18px 16px 24px;}

  /* Login screen */
  .login-wrap{
    min-height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px;
  }
  .login-mark{
    width:64px;height:64px;
    border:2px solid var(--stamp-orange);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:22px;font-weight:700;
    color:var(--stamp-orange);
    transform:rotate(-5deg);
    margin:0 auto 18px;
  }
  .login-title{font-size:22px;font-weight:700;text-align:center;margin:0 0 4px;}
  .login-sub{font-size:13px;color:var(--muted-dark);text-align:center;margin:0 0 32px;font-family:'JetBrains Mono',monospace;}
  .role-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:24px;}
  .role-card{
    display:flex;align-items:center;gap:14px;text-align:left;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 16px;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .role-card:active{transform:scale(0.98);}
  .role-card.selected{border-color:var(--stamp-orange);border-width:2px;background:#FFF8F4;}
  .role-card .ricon{font-size:24px;flex-shrink:0;}
  .role-card .rtext{display:flex;flex-direction:column;}
  .role-card .rname{font-size:14px;font-weight:600;}
  .role-card .rdesc{font-size:11.5px;color:var(--muted-dark);margin-top:2px;}

  label.field-label{
    font-size:11px;font-weight:600;color:var(--muted-dark);
    text-transform:uppercase;letter-spacing:0.6px;
    display:block;margin-bottom:6px;
  }
  select, input[type=text], input[type=password]{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:var(--paper-raised);
    font-size:15px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    margin-bottom:16px;

<body>
<div id="app"></div>

<script>
(function(){

// ---------- Firebase setup ----------
// 1. Create a free project at https://console.firebase.google.com
// 2. Add a Web App, enable Firestore (in test mode is fine to start), and paste
//    your project's config values below, replacing the placeholders.
const firebaseConfig = {
  apiKey: "AIzaSyBZGeFtaTP-4wIi690v0bVeVBUwHagW25g",
  authDomain: "odt-manifest.firebaseapp.com",
  projectId: "odt-manifest",
  storageBucket: "odt-manifest.firebasestorage.app",
  messagingSenderId: "129556036173",
  appId: "1:129556036173:web:010358cd958d461329ba04"
};

let db = null;
let firebaseReady = false;
let authFailed = false;
async function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }catch(e){
    console.error('Firebase failed to initialize:', e);
    firebaseReady = false;
    return;
  }
  try{
    // Anonymous auth lets the Firestore rules require request.auth != null
    // instead of being wide open to the internet — it doesn't change how
    // staff sign in (still just the role PIN), it just stops random bots
    // that scan for publicly-open Firestore projects from touching the data.
    await firebase.auth().signInAnonymously();
  }catch(e){
    console.warn('Anonymous sign-in failed (enable Anonymous auth in the Firebase console):', e);
    authFailed = true;
  }
}

// ---------- Storage helpers ----------
// ODTs are stored in Firestore (shared across every device).
// The current session (who is signed in on THIS phone) stays in
// localStorage, since that's meant to be per-device, not shared.
let lastDbError = null;
let activeScanStream = null;
function stopScanStream(){
  if(activeScanStream){
    activeScanStream.getTracks().forEach(t=>t.stop());
    activeScanStream = null;
  }
}
async function dbGet(key, shared){
  if(shared){
    if(!firebaseReady) return null;
    try{
      const doc = await db.collection('odts').doc(key).get();
      if(!doc.exists) return null;
      const raw = doc.data().payloadJson;
      return raw ? JSON.parse(raw) : null;
    }catch(e){ console.error('dbGet failed:', e); lastDbError = e.message || String(e); return null; }
  } else {
    try{
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
}
async function dbSet(key, value, shared){
  if(shared){
    if(!firebaseReady) return false;
    try{
      await db.collection('odts').doc(key).set({ payloadJson: JSON.stringify(value), updatedAt: Date.now() });
      return true;
    }catch(e){ console.error('dbSet failed:', e); lastDbError = e.message || String(e); return false; }
  } else {
    try{
      if(value === null){ localStorage.removeItem(key); }
      else{ localStorage.setItem(key, JSON.stringify(value)); }
      return true;
    }catch(e){ return false; }
  }
}
async function dbList(prefix, shared){
  if(shared){
    if(!firebaseReady) return [];
    try{
      const snap = await db.collection('odts').get();
      return snap.docs.map(d => prefix + d.id);
    }catch(e){ console.error('dbList failed:', e); lastDbError = e.message || String(e); return []; }
  } else {
    return Object.keys(localStorage).filter(k => k.startsWith(prefix));
  }
}

// ---------- App state ----------
const STORES = [
  {code:"033", name:"PLAYA"},
  {code:"037", name:"PLAZA MOGÁN"},
  {code:"040", name:"PUERTO"},
  {code:"041", name:"PUERTO RICO"},
  {code:"042", name:"NEPTUNO"},
  {code:"045", name:"SAN AGUSTIN"},
];
function storeLabel(s){ return s.code + ' — ' + s.name; }
function storeByCode(code){ return STORES.find(s=>s.code===code); }
function storeLabelFromCode(code){ const s = storeByCode(code); return s ? storeLabel(s) : code; }

// Fields that hold large base64 image/signature data. These are kept out of
// the list-loading path (see saveODT / loadAllODTs / ensureFullOdt below) so
// that opening the app doesn't mean downloading every photo ever taken —
// only the ODT summary is fetched up front, and photos load on demand when
// someone actually opens that ODT.
const HEAVY_FIELDS = ['creationPhotoData', 'photoData', 'signatureData'];
function stripHeavyFields(odt){
  const meta = {...odt};
  HEAVY_FIELDS.forEach(f => { meta[f] = odt[f] ? true : null; });
  return meta;
}

// Fixed single-user credentials for roles that are one person.
// Edit the name and pin here. Store role has no PIN — see login flow below.
const ROLE_CREDENTIALS = {
  operations: { name: "Operations", pin: "1111" },
  admin:      { name: "Admin",      pin: "2222" },
  driver:     { name: "Driver",     pin: "3333" },
};

let state = {
  screen: 'login',       // login | home | route | odt_detail | create | profile
  role: null,             // operations | driver | store | admin
  userName: null,
  storeAssigned: null,    // for store role
  odts: [],               // loaded from shared storage
  activeOdtId: null,
  loading: true,
  odtsLoading: false,     // true while the ODT list is streaming in behind an already-visible screen
  firebaseError: false,
  loadError: null,        // set when the shared ODT list fails to load (e.g. Firestore permissions)
  modal: null,            // {type:'create'|'load'|'deliver', odtId}
  filter: 'all',
  toast: null,
};

function isValidODTFormat(v){
  return /\S/.test(v);
}

let toastTimeout = null;
function showToast(msg){
  state.toast = msg;
  // Update the toast element directly rather than calling render() — a full
  // re-render would rebuild whatever modal is open from scratch, discarding
  // any boxes, photos, or field values the user had already entered.
  const app = document.getElementById('app');
  let t = app.querySelector('.toast');
  if(!t){
    t = document.createElement('div');
    t.className = 'toast';
    app.appendChild(t);
  }
  t.textContent = msg;
  const isError = /save failed/i.test(msg);
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{
    state.toast = null;
    const cur = document.getElementById('app');
    const el = cur && cur.querySelector('.toast');
    if(el) el.remove();
  }, isError ? 6000 : 2200);
}

// ---------- Data load/save ----------
async function loadAllODTs(){
  if(!firebaseReady){ state.odts = []; return; }
  try{
    const snap = await db.collection('odts').get();
    const odts = snap.docs
      .map(d => {
        const data = d.data();
        if(data.metaJson){
          try{
            const meta = JSON.parse(data.metaJson);
            return {...meta, _photosLoaded: false};
          }catch(e){ return null; }
        }
        // Legacy documents saved before the meta/photo split — the full
        // record, photos included, is already sitting in payloadJson, so
        // there's nothing further to lazy-load for these.
        if(data.payloadJson){
          try{
            const full = JSON.parse(data.payloadJson);
            return {...full, _photosLoaded: true};
          }catch(e){ return null; }
        }
        return null;
      })
      .filter(Boolean);
    odts.sort((a,b)=> b.createdAt - a.createdAt);
    state.odts = odts;
    state.loadError = null;
  }catch(e){
    console.error('loadAllODTs failed:', e);
    lastDbError = e.message || String(e);
    state.odts = [];
    if(authFailed && /permission/i.test(lastDbError || '')){
      state.loadError = "Not signed in to the database (anonymous sign-in failed). In Firebase Console, go to Authentication → Sign-in method and make sure \"Anonymous\" is enabled, then reload this app.";
    } else {
      state.loadError = lastDbError || 'Could not load ODTs from the database.';
    }
  }
}

// Fetches the heavy photo/signature data for one ODT, only when it's
// actually needed (opening its detail screen). Mutates the matching entry
// in state.odts in place and marks it as loaded so we never re-fetch it
// twice in the same session.
async function ensureFullOdt(id){
  const odt = state.odts.find(o => o.id === id);
  if(!odt || odt._photosLoaded || !firebaseReady) return odt;
  try{
    const doc = await db.collection('odts').doc(id).collection('blob').doc('data').get();
    if(doc.exists){
      const raw = doc.data().payloadJson;
      const full = raw ? JSON.parse(raw) : null;
      if(full) Object.assign(odt, full);
    }
    odt._photosLoaded = true;
  }catch(e){
    console.error('ensureFullOdt failed:', e);
  }
  return odt;
}

async function saveODT(odt){
  // If this record still has un-fetched heavy fields (the `true` markers
  // set by loadAllODTs/stripHeavyFields), pull the real values in first —
  // otherwise writing this object back out would overwrite real photos or
  // a signature with a placeholder marker and lose them for good. This can
  // happen whenever an action (deliver, load check-in, review, scan) is
  // triggered on an ODT whose detail screen was never opened.
  if(!odt._photosLoaded && HEAVY_FIELDS.some(f => odt[f] === true)){
    await ensureFullOdt(odt.id);
  }
  const approxSize = JSON.stringify(odt).length;
  if(approxSize > 950000){
    lastDbError = 'This ODT\'s data (photos + signature) is too large to save. Try retaking the photo(s) with less detail, or contact support.';
    return false;
  }
  if(!firebaseReady){ lastDbError = 'Not connected to the database.'; return false; }
  try{
    const meta = stripHeavyFields(odt);
    const mainRef = db.collection('odts').doc(odt.id);
    const blobRef = mainRef.collection('blob').doc('data');
    const batch = db.batch();
    batch.set(mainRef, { metaJson: JSON.stringify(meta), updatedAt: Date.now() });
    batch.set(blobRef, { payloadJson: JSON.stringify(odt) });
    await batch.commit();
    return true;
  }catch(e){
    console.error('saveODT failed:', e);
    lastDbError = e.message || String(e);
    if(authFailed && /permission/i.test(lastDbError || '')){
      lastDbError = "Not signed in to the database (anonymous sign-in failed). In Firebase Console, go to Authentication → Sign-in method and make sure \"Anonymous\" is enabled, then reload this app.";
    }
    return false;
  }
}

// ---------- Init ----------
async function init(){
  await initFirebase();
  if(!firebaseReady){
    state.loading = false;
    state.firebaseError = true;
    render();
    return;
  }
  const session = await dbGet('session', false);
  if(session){
    state.role = session.role;
    state.userName = session.userName;
    state.storeAssigned = session.storeAssigned || null;
    state.screen = session.role === 'driver' ? 'route' : 'home';
    // Show the shell right away, then stream the ODT list in — no reason to
    // make someone stare at a spinner while every ODT summary downloads.
    state.loading = false;
    state.odtsLoading = true;
    render();
    await loadAllODTs();
    state.odtsLoading = false;
    render();
  } else {
    // Nothing to load yet — the login screen doesn't need any ODT data.
    state.loading = false;
    render();
  }
}

async function saveSession(){
  await dbSet('session', {role:state.role, userName:state.userName, storeAssigned:state.storeAssigned}, false);
}

// Shared by every login path: show the destination screen right away, then
// fetch the (lightweight, photo-free) ODT list in the background so signing
// in never feels like it's hanging on a big download.
async function enterApp(){
  await saveSession();
  state.odtsLoading = true;
  render();
  await loadAllODTs();
  state.odtsLoading = false;
  render();
}

// ---------- Render root ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.loading){
    app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:13px;">Loading manifest data…</div>';
    return;
  }
  if(state.firebaseError){
    app.innerHTML = `
      <div style="padding:40px 24px;text-align:center;">
        <div style="font-size:32px;margin-bottom:14px;">⚠️</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:10px;">Database not connected</div>
        <div style="font-size:13.5px;color:var(--muted-dark);line-height:1.5;">
          This app needs a Firebase project to store ODTs. Open the page source and fill in the
          <code style="background:var(--paper-dim);padding:2px 6px;border-radius:4px;">firebaseConfig</code>
          values near the top of the script with your own Firebase project's settings, then reload.
        </div>
      </div>
    `;
    return;
  }
  if(state.screen === 'login'){
    renderLogin(app);
    return;
  }
  renderTopbar(app);
  const content = document.createElement('div');
  content.className = 'content';
  app.appendChild(content);

  if(state.loadError){
    const banner = document.createElement('div');
    banner.className = 'card';
    banner.style = 'border:1.5px solid var(--stamp-red);margin-bottom:14px;';
    banner.innerHTML = `
      <div style="font-weight:700;color:var(--stamp-red);margin-bottom:6px;">⚠️ Couldn't load data from the database</div>
      <div style="font-size:12.5px;color:var(--muted-dark);line-height:1.5;margin-bottom:12px;">${escapeHtml(state.loadError)}</div>
      <button class="btn btn-outline btn-sm" id="retryLoadBtn">Retry</button>
    `;
    content.appendChild(banner);
    banner.querySelector('#retryLoadBtn').addEventListener('click', async ()=>{
      banner.querySelector('#retryLoadBtn').textContent = 'Retrying…';
      await loadAllODTs();
      render();
    });
  }

  if(state.screen === 'home') renderHome(content);
  if(state.screen === 'route') renderRoute(content);
  if(state.screen === 'odt_detail') renderOdtDetail(content);

  renderTabbar(app);

  // The camera stream must only stay alive while the scanner modal is
  // actually on screen — stop it on every other render so we don't leave
  // the driver's camera running in the background.
  if(!(state.modal && state.modal.type === 'scan')){
    stopScanStream();
  }
  if(state.modal){
    renderModal(app);
  }
  if(state.toast){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = state.toast;
    app.appendChild(t);
  }
}

// ---------- Login screen ----------
function renderLogin(app){
  const wrap = document.createElement('div');
  wrap.className = 'login-wrap';
  wrap.innerHTML = `
    <div class="login-mark">ODT</div>
    <h1 class="login-title">Dispatch Manifest</h1>
    <p class="login-sub">SIGN IN TO CONTINUE</p>
    <label class="field-label">Your role</label>
    <div class="role-grid" id="roleGrid">
      ${roleCardHtml('operations','📦','Operations','Create & track ODTs')}
      ${roleCardHtml('driver','🚚','Driver','Route, scan &amp; deliver')}
      ${roleCardHtml('store','🏬','Store','Receives goods')}
      ${roleCardHtml('admin','📋','Admin','Full overview')}
    </div>
    <div id="loginFields"></div>
  `;
  app.appendChild(wrap);

  wrap.querySelectorAll('.role-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const role = card.dataset.role;
      wrap.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      if(role === 'store'){
        renderStoreFields();
      } else {
        renderPinFields(role);
      }
    });
  });

  function renderStoreFields(){
    const fieldsDiv = wrap.querySelector('#loginFields');
    fieldsDiv.innerHTML = `
      <label class="field-label">Your store</label>
      <select id="storeSelect">
        ${STORES.map(s=>`<option value="${s.code}">${storeLabel(s)}</option>`).join('')}
      </select>
      <label class="field-label">Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. María González" />
      <button class="btn btn-stamp" id="loginBtn" style="margin-top:6px;">Sign in</button>
    `;
    fieldsDiv.querySelector('#loginBtn').addEventListener('click', async ()=>{
      const name = fieldsDiv.querySelector('#nameInput').value.trim();
      if(!name){ showToastRaw('Enter your name to continue'); return; }
      state.role = 'store';
      state.userName = name;
      state.storeAssigned = fieldsDiv.querySelector('#storeSelect').value;
      state.screen = 'home';
      enterApp();
    });
  }

  function renderPinFields(role){
    const fieldsDiv = wrap.querySelector('#loginFields');
    const roleNiceName = {operations:'Operations', admin:'Admin', driver:'Driver'}[role];
    fieldsDiv.innerHTML = `
      <label class="field-label">${roleNiceName} PIN</label>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="Enter PIN" maxlength="12" />
      <button class="btn btn-stamp" id="pinLoginBtn" style="margin-top:6px;">Sign in</button>
    `;
    const pinInput = fieldsDiv.querySelector('#pinInput');
    pinInput.focus();
    function attemptLogin(){
      const pin = pinInput.value.trim();
      const creds = ROLE_CREDENTIALS[role];
      if(!pin){ showToastRaw('Enter the PIN to continue'); return; }
      if(pin !== creds.pin){ showToastRaw('Incorrect PIN'); pinInput.value=''; pinInput.focus(); return; }
      state.role = role;
      state.userName = creds.name;
      state.storeAssigned = null;
      state.screen = role === 'driver' ? 'route' : 'home';
      enterApp();
    }
    fieldsDiv.querySelector('#pinLoginBtn').addEventListener('click', attemptLogin);
    pinInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptLogin(); });
  }

  function showToastRaw(msg){
    let t = wrap.querySelector('.inline-warn');
    if(!t){
      t = document.createElement('p');
      t.className = 'inline-warn';
      t.style = 'color:var(--stamp-red);font-size:12.5px;text-align:center;margin-top:10px;';
      wrap.appendChild(t);
    }
    t.textContent = msg;
  }
}

function roleCardHtml(role, icon, name, desc){
  return `<div class="role-card" data-role="${role}">
    <span class="ricon">${icon}</span>
    <div class="rtext">
      <div class="rname">${name}</div>
      <div class="rdesc">${desc}</div>
    </div>
  </div>`;
}

// ---------- Tabbar ----------
function renderTabbar(app){
  const bar = document.createElement('div');
  bar.className = 'tabbar';

  const tabs = state.role === 'driver'
    ? [{key:'route', icon:'🛣️', label:'Route'}, {key:'home', icon:'📋', label:'Manifest'}]
    : [{key:'home', icon:'📋', label:'Manifest'}];

  bar.innerHTML = tabs.map(t=>`
    <div class="tab-item ${state.screen===t.key?'active':''}" data-key="${t.key}">
      <span class="ticon">${t.icon}</span><span>${t.label}</span>
    </div>
  `).join('');
  app.appendChild(bar);
  bar.querySelectorAll('.tab-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.screen = el.dataset.key; state.activeOdtId=null; render();
    });
  });

  if(state.role === 'operations'){
    const fab = document.createElement('button');
    fab.className = 'fab';
    fab.textContent = '+';
    fab.setAttribute('aria-label','Create new ODT');
    fab.addEventListener('click', ()=>{ state.modal = {type:'create'}; render(); });
    app.appendChild(fab);
  }
  if(state.role === 'driver'){
    const fab = document.createElement('button');
    fab.className = 'fab fab-scan';
    fab.textContent = '🔳';
    fab.setAttribute('aria-label','Scan ODT code');
    fab.addEventListener('click', ()=>{ state.modal = {type:'scan'}; render(); });
    app.appendChild(fab);
  }
}

  let list = state.odts;
  if(state.role === 'store'){
    list = list.filter(o => o.destinationStore === state.storeAssigned);
  }
  if(state.filter !== 'all'){
    list = list.filter(o => o.status === state.filter);
  }
  // Urgent ODTs surface first regardless of creation date.
  return [...list].sort((a,b) => (b.urgent?1:0) - (a.urgent?1:0));
}

function renderHome(content){
  if(state.odtsLoading && state.odts.length === 0){
    content.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;">Loading ODTs…</div>';
    return;
  }

  const head = document.createElement('div');
  head.className = 'section-head';

    {k:'verified', label:'Verified'},

    {k:'resolved', label:'Solved'},

  filters.forEach(f=>{

// ---------- Route: driver's stops, grouped by destination store ----------
function renderRoute(content){
  if(state.odtsLoading && state.odts.length === 0){
    content.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;">Loading your route…</div>';
    return;
  }

  const head = document.createElement('div');
  head.className = 'section-head';
  const pending = state.odts.filter(o => o.status === 'loaded');
  head.innerHTML = `<h2>Your Route</h2><span class="count">${pending.length} pending</span>`;
  content.appendChild(head);

  if(pending.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <span class="eicon">🛣️</span>
      <div class="etitle">No pending deliveries</div>
      <div class="edesc">Once an ODT is checked in as loaded, it'll show up here as a stop on your route.</div>
    `;
    content.appendChild(empty);
    return;
  }

  const stops = [];
  STORES.forEach(store=>{
    const stopOdts = pending.filter(o => o.destinationStore === store.code);
    if(stopOdts.length) stops.push({store, odts: stopOdts});
  });

  const knownCodes = STORES.map(s=>s.code);
  const orphan = pending.filter(o => !knownCodes.includes(o.destinationStore));
  if(orphan.length){
    stops.push({store:{code:null, name:'Other destination'}, odts: orphan});
  }

  // Stops with an urgent ODT jump to the top of the route so the driver
  // tackles priority deliveries first, ahead of the normal store order.
  stops.sort((a,b) => {
    const aUrgent = a.odts.some(o=>o.urgent) ? 1 : 0;
    const bUrgent = b.odts.some(o=>o.urgent) ? 1 : 0;
    return bUrgent - aUrgent;
  });

  stops.forEach(s=>{
    const sortedOdts = [...s.odts].sort((a,b) => (b.urgent?1:0) - (a.urgent?1:0));
    content.appendChild(renderStopCard(s.store, sortedOdts));
  });
}

function renderStopCard(store, odts){
  const card = document.createElement('div');
  card.className = 'card stop-card';
  const totalBoxes = odts.reduce((s,o)=>s + o.boxes.reduce((ss,b)=>ss+b.qty,0), 0);
  const stopUrgent = odts.some(o=>o.urgent);
  card.innerHTML = `
    <div class="stop-head">
      <div>
        <div class="stop-store">${store.code ? storeLabel(store) : store.name}</div>
        <div class="stop-sub">${odts.length} ODT${odts.length!==1?'s':''} · ${totalBoxes} box${totalBoxes!==1?'es':''}</div>
      </div>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        ${stopUrgent ? '<span class="urgent-badge">🔴 Urgent</span>' : ''}
        <span class="status-chip status-loaded">${statusLabel('loaded')}</span>
      </span>
    </div>
  `;
  odts.forEach(odt=>{
    const row = document.createElement('div');
    row.className = 'stop-row';
    row.innerHTML = `
      <div>
        <div class="mono stop-odt">${odt.id}${odt.urgent ? ' <span class="urgent-badge" style="margin-left:6px;">🔴 Urgent</span>' : ''}</div>
        <div class="stop-odt-sub">${odt.boxes.reduce((s,b)=>s+b.qty,0)} boxes · ${odt.originLabel}</div>
      </div>
      <button class="btn btn-green btn-sm stop-deliver-btn" data-id="${odt.id}">Deliver</button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.stop-deliver-btn')) return;
      state.activeOdtId = odt.id;
      state.screen = 'odt_detail';
      render();
    });
    card.appendChild(row);
  });
  card.querySelectorAll('.stop-deliver-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.modal = {type:'deliver', odtId: btn.dataset.id};
      render();
    });
  });
  return card;
}

function renderAdminStats(content){
  const grid = document.createElement('div');
  grid.className = 'admin-stat-grid';
  const total = state.odts.length;
  const inTransit = state.odts.filter(o=>o.status==='loaded').length;

    <div class="stat-box"><div class="stat-num" style="color:var(--stamp-green-dark);">${delivered}</div><div class="stat-label">Received</div></div>
    <div class="stat-box"><div class="stat-num" style="color:${disc>0?'var(--stamp-red-dark)':'var(--muted)'};">${disc}</div><div class="stat-label">Discrepancies</div></div>
    <div class="stat-box" style="grid-column:1 / -1;"><div class="stat-num" style="color:${urgent>0?'var(--stamp-red)':'var(--muted)'};">${urgent}</div><div class="stat-label">Urgent open</div></div>

function statusLabel(s){
  return {created:'Created', loaded:'In transit', delivered:'Received', verified:'Verified', discrepancy:'Discrepancy', resolved:'Solved'}[s] || s;
}

function renderTicketCard(odt){
  const card = document.createElement('div');

  card.innerHTML = `
    <div class="ticket-top">
      <div>
        <div class="ticket-odt mono">${odt.id}</div>

// ---------- ODT Detail ----------
function renderOdtDetail(content){
  const odt = state.odts.find(o=>o.id===state.activeOdtId);
  if(!odt){
    content.innerHTML = '<p>ODT not found.</p>';
    return;
  }

  // Photos/signature aren't fetched with the main list (see loadAllODTs) —
  // pull them in now that this specific ODT is actually being viewed.
  const hasUnloadedPhotos = HEAVY_FIELDS.some(f => odt[f] === true) && !odt._photosLoaded;
  if(hasUnloadedPhotos){
    ensureFullOdt(odt.id).then(()=>{
      if(state.screen === 'odt_detail' && state.activeOdtId === odt.id) render();
    });
  }
  function photoExtra(field, altText, cssClass){
    const v = odt[field];
    if(!v) return '';
    if(v === true && !odt._photosLoaded){
      return `<div class="note-text">Loading photo…</div>`;
    }
    if(typeof v === 'string'){
      return `<img class="${cssClass}" src="${v}" alt="${altText}" />`;
    }
    return '';
  }

  const header = document.createElement('div');
  header.className = 'detail-header';
  header.innerHTML = `
    <button class="back-btn" id="backBtn" aria-label="Back">←</button>
    <div class="detail-odt mono">${odt.id}</div>
    ${odt.urgent ? '<span class="urgent-badge" style="margin-left:auto;">🔴 Urgent</span>' : ''}
  `;
  content.appendChild(header);
  header.querySelector('#backBtn').addEventListener('click', ()=>{ state.screen='home'; render(); });

  const metaRow = document.createElement('div');
  metaRow.className = 'detail-meta-row';
  const totalBoxes = odt.boxes.reduce((s,b)=>s+b.qty,0);
  metaRow.innerHTML = `
    <span>${odt.originLabel} → ${storeLabelFromCode(odt.destinationStore)}</span>
    <span>${totalBoxes} boxes</span>
  `;
  content.appendChild(metaRow);

  if(state.role === 'operations' || state.role === 'admin'){
    const urgentRow = document.createElement('div');
    urgentRow.className = 'card';
    urgentRow.style = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;';
    urgentRow.innerHTML = `
      <div>
        <div style="font-weight:700;font-size:14px;">🔴 Urgent priority</div>
        <div style="font-size:11.5px;color:var(--muted-dark);margin-top:2px;">Puts this ODT at the top of the driver's route</div>
      </div>
      <div class="switch ${odt.urgent?'switch-on':''}" id="urgentDetailSwitch"><div class="switch-knob"></div></div>
    `;
    content.appendChild(urgentRow);
    urgentRow.querySelector('#urgentDetailSwitch').addEventListener('click', async (e)=>{
      const sw = e.currentTarget;
      const previous = !!odt.urgent;
      odt.urgent = !previous;
      sw.classList.toggle('switch-on', odt.urgent);
      const ok = await saveODT(odt);
      if(!ok){
        odt.urgent = previous;
        sw.classList.toggle('switch-on', odt.urgent);
        showToast('Save failed: ' + (lastDbError || 'could not reach the database'));
        return;
      }
      showToast(odt.urgent ? `${odt.id} marked urgent` : `${odt.id} urgent removed`);
    });
  }

  // Box manifest
  const boxCard = document.createElement('div');
  boxCard.className = 'card';
  boxCard.innerHTML = `<div class="field-label" style="margin-bottom:8px;">Box manifest</div>` +
    odt.boxes.map(b=>`<div class="box-list-row"><span>${b.label}</span><span class="qty-badge mono">×${b.qty}</span></div>`).join('');
  content.appendChild(boxCard);

  // Timeline
  const tl = document.createElement('div');
  tl.className = 'timeline';

  // Step 1: created
  tl.appendChild(timelineStep({
    done:true,
    color:'',
    label:'ODT created',
    sub: `${odt.createdBy} · ${formatDate(odt.createdAt)}`,
    extra: photoExtra('creationPhotoData', 'Photo of the ODT at creation', 'photo-thumb')
  }));

  // Step 2: loaded
  if(odt.loadedAt){
    tl.appendChild(timelineStep({
      done:true,
      color:'stamp-orange',
      label:'Checked in on vehicle',
      sub: `${odt.loadedBy} · ${formatDate(odt.loadedAt)}${odt.vehicleId ? ' · ' + odt.vehicleId : ''}`,
      extra: `<div class="stamp-graphic orange">✓ Loaded</div>`
    }));
  } else {
    tl.appendChild(timelineStep({
      done:false,
      label:'Awaiting load check-in',
      sub: (state.role==='driver') ? 'Tap below to check in this load' : 'Pending driver action',
      extra: (state.role==='driver') ? `<button class="btn btn-stamp btn-sm" id="loadActionBtn" style="margin-top:8px;">Check in load</button>` : null
    }));
  }

  // Step 3: delivered
  if(odt.deliveredAt){
    let extraHtml = `<div class="stamp-graphic green">✓ Received</div>`;
    if(odt.signatureData){
      extraHtml += photoExtra('signatureData', 'Receiving signature', 'sig-thumb');
    }
    if(odt.photoData){
      extraHtml += photoExtra('photoData', 'Photo of received boxes', 'photo-thumb');
    }
    if(odt.deliveryNote){
      extraHtml += `<p class="note-text">Note: ${escapeHtml(odt.deliveryNote)}</p>`;
    }
    tl.appendChild(timelineStep({
      done:true,
      color:'stamp-green',
      label: 'Received at store',
      sub: `${odt.deliveredBy} · ${formatDate(odt.deliveredAt)}`,
      extra: extraHtml
    }));
  } else if(odt.loadedAt) {
    const canAct = (state.role==='store' && state.storeAssigned===odt.destinationStore) || state.role==='driver';
    tl.appendChild(timelineStep({
      done:false,
      label:'Awaiting store confirmation',
      sub: canAct ? 'Tap below to confirm receipt' : `Pending sign-off at ${storeLabelFromCode(odt.destinationStore)}`,
      extra: canAct ? `<button class="btn btn-green btn-sm" id="deliverActionBtn" style="margin-top:8px;">Confirm receipt</button>` : null
    }));
  } else {
    tl.appendChild(timelineStep({done:false, label:'Awaiting store confirmation', sub:'Vehicle not yet loaded', extra:null}));
  }

  // Step 4: product review — once the store has physically received the
  // boxes, they check the contents against the manifest and mark the ODT
  // as correct, or report exactly what was wrong.
  if(odt.deliveredAt){
    const canReview = state.role === 'store' && state.storeAssigned === odt.destinationStore;
    if(odt.status === 'verified'){
      tl.appendChild(timelineStep({
        done:true,
        color:'stamp-green',
        label:'Products reviewed — all correct',
        sub: odt.reviewedBy ? `${odt.reviewedBy} · ${formatDate(odt.reviewedAt)}` : '',
        extra: `<div class="stamp-graphic green">✓ Verified</div>`
      }));
    } else if(odt.status === 'discrepancy'){
      tl.appendChild(timelineStep({
        done:true,
        color:'stamp-red',
        label:'Issue reported',
        sub: odt.reviewedBy ? `${odt.reviewedBy} · ${formatDate(odt.reviewedAt)}` : `${odt.deliveredBy} · ${formatDate(odt.deliveredAt)}`,
        extra: (odt.reviewNote || odt.deliveryNote) ? `<p class="note-text">Note: ${escapeHtml(odt.reviewNote || odt.deliveryNote)}</p>` : null
      }));
    } else {
      tl.appendChild(timelineStep({
        done:false,
        label:'Awaiting product review',
        sub: canReview ? 'Check the boxes against the manifest, then mark this ODT' : `Pending review at ${storeLabelFromCode(odt.destinationStore)}`,
        extra: canReview ? `
          <input type="text" id="reviewByInput" value="${escapeHtml(state.userName)}" placeholder="Your name" style="margin-top:8px;" />
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn btn-green btn-sm" id="reviewOkBtn" style="flex:1;">Mark as correct</button>
            <button class="btn btn-danger-outline btn-sm" id="reviewErrBtn" style="flex:1;">Report an error</button>
          </div>
          <div id="reviewNoteWrap" style="display:none;margin-top:10px;">
            <input type="text" id="reviewNoteInput" placeholder="e.g. 2 units missing, wrong size" />
            <button class="btn btn-danger-outline btn-sm" id="reviewSubmitBtn" style="width:auto;margin-top:6px;">Submit</button>
          </div>
        ` : null
      }));
    }
  }

  // Step 5: issue resolution — once a discrepancy is reported, Operations
  // follows up and marks it solved (with an optional note on the fix).
  if(odt.status === 'discrepancy' || odt.status === 'resolved'){
    const canResolve = state.role === 'operations';
    if(odt.status === 'resolved'){
      tl.appendChild(timelineStep({
        done:true,
        color:'stamp-green',
        label:'Issue solved',
        sub: odt.resolvedBy ? `${odt.resolvedBy} · ${formatDate(odt.resolvedAt)}` : '',
        extra: odt.resolutionNote
          ? `<p class="note-text">Resolution: ${escapeHtml(odt.resolutionNote)}</p>`
          : `<div class="stamp-graphic green">✓ Solved</div>`
      }));
    } else {
      tl.appendChild(timelineStep({
        done:false,
        label:'Awaiting resolution',
        sub: canResolve ? 'Follow up on this issue, then mark it once solved' : 'Pending action from Operations',
        extra: canResolve ? `
          <div style="margin-top:8px;">
            <input type="text" id="resolveNoteInput" placeholder="What was done to fix it (optional)" />
            <button class="btn btn-green btn-sm" id="resolveBtn" style="margin-top:8px;">Mark issue as solved</button>
          </div>
        ` : null
      }));
    }
  }

  content.appendChild(tl);

  const loadBtn = tl.querySelector('#loadActionBtn');
  if(loadBtn) loadBtn.addEventListener('click', ()=>{ state.modal={type:'load', odtId:odt.id}; render(); });
  const delBtn = tl.querySelector('#deliverActionBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{ state.modal={type:'deliver', odtId:odt.id}; render(); });

  async function submitReview(isOk, note){
    const reviewByInput = tl.querySelector('#reviewByInput');
    const reviewByName = reviewByInput ? reviewByInput.value.trim() : state.userName;
    if(!reviewByName){
      if(reviewByInput) reviewByInput.classList.add('input-error');
      showToast('Enter your name before submitting');
      return;
    }
    odt.status = isOk ? 'verified' : 'discrepancy';
    odt.reviewedBy = reviewByName;
    odt.reviewedAt = Date.now();
    odt.reviewNote = isOk ? null : (note || 'Discrepancy reported');
    const ok = await saveODT(odt);
    if(!ok){
      showToast('Save failed: ' + (lastDbError || 'could not reach the database'));
      return;
    }
    showToast(isOk ? `${odt.id} marked as correct` : `${odt.id} — issue reported`);
    if(state.role === 'store' && state.userName !== reviewByName){
      state.userName = reviewByName;
      saveSession();
    }
    render();
  }

  const reviewByInputEl = tl.querySelector('#reviewByInput');
  if(reviewByInputEl) reviewByInputEl.addEventListener('input', (e)=> e.target.classList.remove('input-error'));

  const reviewOkBtn = tl.querySelector('#reviewOkBtn');
  if(reviewOkBtn) reviewOkBtn.addEventListener('click', ()=> submitReview(true));

  const reviewErrBtn = tl.querySelector('#reviewErrBtn');
  if(reviewErrBtn) reviewErrBtn.addEventListener('click', ()=>{
    tl.querySelector('#reviewNoteWrap').style.display = 'block';
    tl.querySelector('#reviewNoteInput').focus();
  });

  const reviewSubmitBtn = tl.querySelector('#reviewSubmitBtn');
  if(reviewSubmitBtn) reviewSubmitBtn.addEventListener('click', ()=>{
    submitReview(false, tl.querySelector('#reviewNoteInput').value.trim());
  });

  const resolveBtn = tl.querySelector('#resolveBtn');
  if(resolveBtn) resolveBtn.addEventListener('click', async ()=>{
    const noteVal = tl.querySelector('#resolveNoteInput').value.trim();
    odt.status = 'resolved';
    odt.resolvedBy = state.userName;
    odt.resolvedAt = Date.now();
    odt.resolutionNote = noteVal || null;
    const ok = await saveODT(odt);
    if(!ok){
      odt.status = 'discrepancy';
      odt.resolvedBy = null;
      odt.resolvedAt = null;
      odt.resolutionNote = null;
      showToast('Save failed: ' + (lastDbError || 'could not reach the database'));
      return;
    }
    showToast(`${odt.id} — issue marked as solved`);
    render();
  });
}

function timelineStep({done, color, label, sub, extra}){
  const div = document.createElement('div');
  div.className = 'tl-step ' + (done?'done':'tl-pending') + (color?(' '+color):'');
  div.innerHTML = `
    <div class="tl-dot">${done?'<div class="dotmark"></div>':''}</div>
    <div class="tl-label">${label}</div>
    <div class="tl-sub">${sub}</div>
    ${extra||''}
  `;
  return div;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Compresses/resizes a photo File down to a JPEG data URL well under
// Firestore's 1MB per-field limit. Phone camera photos are normally several
// MB once base64-encoded, so this is required before saving any photo.
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if(height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Tries progressively smaller/lower-quality settings until the resulting
// data URL fits safely under Firestore's per-field byte limit.
async function compressImageToFit(file, maxBytes){
  const attempts = [
    {maxDim:1280, quality:0.7},
    {maxDim:1024, quality:0.6},
    {maxDim:800,  quality:0.5},
    {maxDim:600,  quality:0.4},
    {maxDim:450,  quality:0.35},
  ];
  let result = null;
  for(const a of attempts){
    result = await compressImageFile(file, a.maxDim, a.quality);
    if(result.length <= maxBytes) return result;
  }
  return result; // best effort, smallest attempt
}

// ---------- Modals ----------
function renderModal(app){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ state.modal=null; render(); } });
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.addEventListener('click', e=>e.stopPropagation());
  overlay.appendChild(sheet);
  app.appendChild(overlay);

  sheet.innerHTML = '<div class="modal-handle"></div>';

  if(state.modal.type === 'create') renderCreateModal(sheet);
  if(state.modal.type === 'load') renderLoadModal(sheet);
  if(state.modal.type === 'deliver') renderDeliverModal(sheet);
  if(state.modal.type === 'scan') renderScanModal(sheet);
}

// --- Create ODT modal (Operations) ---
function renderCreateModal(sheet){
  const title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = 'New ODT';
  sheet.appendChild(title);

  const form = document.createElement('div');
  form.innerHTML = `
    <label class="field-label">ODT number</label>
    <input type="text" id="odtNumber" class="mono" placeholder="Enter ODT number from system" autocapitalize="characters" />
    <div id="odtNumberWarn" class="note-text" style="display:none;color:var(--stamp-red);margin-top:-12px;margin-bottom:14px;">An ODT with this number already exists.</div>

    <label class="field-label">Destination store</label>
    <select id="destStore">${STORES.map(s=>`<option value="${s.code}">${storeLabel(s)}</option>`).join('')}</select>

    <div class="urgent-toggle-row" id="urgentToggleRow">
      <div>
        <div class="urgent-toggle-title">🔴 Mark as urgent</div>
        <div class="urgent-toggle-sub">Prioritized at the top of the driver's route</div>
      </div>
      <div class="switch" id="urgentSwitch"><div class="switch-knob"></div></div>
    </div>

    <label class="field-label">Origin / warehouse label</label>
    <input type="text" id="originLabel" placeholder="e.g. Central Warehouse" value="Central Warehouse" />

    <label class="field-label">Boxes in this ODT</label>
    <div id="boxRows"></div>
    <div class="add-box-row" id="addBoxRow">
      <input type="text" id="newBoxLabel" placeholder="Box description (e.g. Footwear)" />
      <input type="text" id="newBoxQty" class="qty-input" placeholder="Qty" inputmode="numeric" />
      <div class="icon-btn" id="addBoxBtn" aria-label="Add box line">+</div>
    </div>
    <div id="boxesWarn" class="note-text" style="display:none;color:var(--stamp-red);margin-top:-6px;margin-bottom:14px;">Add at least one box before creating.</div>

    <label class="field-label">Photo of the ODT <span class="optional-tag">(optional)</span></label>
    <div class="file-input-wrap" id="creationPhotoWrap">
      <span class="ficon">📷</span>
      <span id="creationPhotoPrompt">Tap to take or upload a photo</span>
      <input type="file" accept="image/*" capture="environment" id="creationPhotoInput" />
    </div>
    <img id="creationPhotoPreview" style="display:none;width:100%;border-radius:8px;margin-top:10px;" />

    <button class="btn btn-stamp" id="createBtn" style="margin-top:18px;">Create ODT</button>
  `;
  sheet.appendChild(form);

  let creationPhotoData = null;
  let isUrgent = false;
  const urgentSwitch = form.querySelector('#urgentSwitch');
  urgentSwitch.addEventListener('click', ()=>{
    isUrgent = !isUrgent;
    urgentSwitch.classList.toggle('switch-on', isUrgent);
  });
  const creationPhotoInput = form.querySelector('#creationPhotoInput');
  form.querySelector('#creationPhotoWrap').addEventListener('click', ()=> creationPhotoInput.click());
  creationPhotoInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    form.querySelector('#creationPhotoPrompt').textContent = 'Processing photo…';
    try{
      creationPhotoData = await compressImageToFit(file, 350000);
      const prev = form.querySelector('#creationPhotoPreview');
      prev.src = creationPhotoData;
      prev.style.display = 'block';
      form.querySelector('#creationPhotoPrompt').textContent = 'Photo attached — tap to retake';
    }catch(err){
      showToast('Could not process that photo, please try another');
      form.querySelector('#creationPhotoPrompt').textContent = 'Tap to take or upload a photo';
    }
  });

  const odtNumberInput = form.querySelector('#odtNumber');
  const odtNumberWarn = form.querySelector('#odtNumberWarn');
  odtNumberInput.addEventListener('input', ()=>{
    const v = odtNumberInput.value.trim();
    const exists = v && state.odts.some(o => o.id.toLowerCase() === v.toLowerCase());
    odtNumberWarn.textContent = 'An ODT with this number already exists.';
    odtNumberWarn.style.display = exists ? 'block' : 'none';
    odtNumberInput.classList.remove('input-error');
  });

  let boxes = [];
  const boxRowsDiv = form.querySelector('#boxRows');
  const addBoxRow = form.querySelector('#addBoxRow');
  const boxesWarn = form.querySelector('#boxesWarn');
  const newBoxLabel = form.querySelector('#newBoxLabel');
  const newBoxQty = form.querySelector('#newBoxQty');
  [newBoxLabel, newBoxQty].forEach(el=>{
    el.addEventListener('input', ()=> el.classList.remove('input-error'));
  });

  function renderBoxRows(){
    boxRowsDiv.innerHTML = boxes.map((b,i)=>`
      <div class="box-list-row">
        <span>${escapeHtml(b.label)}</span>
        <span style="display:flex;align-items:center;gap:10px;">
          <span class="qty-badge mono">×${b.qty}</span>
          <span data-i="${i}" class="removeBoxBtn" style="cursor:pointer;color:var(--stamp-red);font-size:13px;">remove</span>
        </span>
      </div>
    `).join('');
    boxRowsDiv.querySelectorAll('.removeBoxBtn').forEach(el=>{
      el.addEventListener('click', ()=>{
        boxes.splice(parseInt(el.dataset.i),1);
        renderBoxRows();
      });
    });
  }

  form.querySelector('#addBoxBtn').addEventListener('click', ()=>{
    const label = newBoxLabel.value.trim();
    const qty = parseInt(newBoxQty.value) || 0;
    newBoxLabel.classList.remove('input-error');
    newBoxQty.classList.remove('input-error');
    if(!label) newBoxLabel.classList.add('input-error');
    if(qty<=0) newBoxQty.classList.add('input-error');
    if(!label || qty<=0) return;
    boxes.push({label, qty});
    newBoxLabel.value='';
    newBoxQty.value='';
    addBoxRow.classList.remove('input-error');
    boxesWarn.style.display = 'none';
    renderBoxRows();
  });

  form.querySelector('#createBtn').addEventListener('click', async ()=>{
    const odtId = odtNumberInput.value.trim();
    let hasError = false;

    odtNumberInput.classList.remove('input-error');
    if(!odtId){
      odtNumberInput.classList.add('input-error');
      odtNumberWarn.textContent = 'Enter the ODT number from the system.';
      odtNumberWarn.style.display = 'block';
      hasError = true;
    } else if(state.odts.some(o => o.id.toLowerCase() === odtId.toLowerCase())){
      odtNumberInput.classList.add('input-error');
      odtNumberWarn.textContent = 'An ODT with this number already exists.';
      odtNumberWarn.style.display = 'block';
      hasError = true;
    }

    if(boxes.length===0){
      addBoxRow.classList.add('input-error');
      boxesWarn.style.display = 'block';
      hasError = true;
    }

    if(hasError){
      if(!state.odts.some(o=>o.id.toLowerCase()===odtId.toLowerCase())) odtNumberInput.focus();
      return;
    }
    const btn = form.querySelector('#createBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating…';
    const odt = {
      id: odtId,
      originLabel: form.querySelector('#originLabel').value.trim() || 'Warehouse',
      destinationStore: form.querySelector('#destStore').value,
      urgent: isUrgent,
      boxes: boxes,
      status: 'created',
      createdBy: state.userName,
      createdAt: Date.now(),
      creationPhotoData: creationPhotoData,
      loadedBy:null, loadedAt:null, vehicleId:null,
      deliveredBy:null, deliveredAt:null, signatureData:null, photoData:null, deliveryNote:null,
      reviewedBy:null, reviewedAt:null, reviewNote:null,
      resolvedBy:null, resolvedAt:null, resolutionNote:null,
    };
    const ok = await saveODT(odt);
    if(!ok){
      btn.disabled = false;
      btn.innerHTML = 'Create ODT';
      showToast('Save failed: ' + (lastDbError || 'could not reach the database'));
      return;
    }
    state.odts.unshift(odt);
    state.modal = null;
    showToast(`${odt.id} created`);
    render();
  });

  renderBoxRows();
}

// --- Load check-in modal (Driver) ---
function renderLoadModal(sheet){
  const odt = state.odts.find(o=>o.id===state.modal.odtId);
  const title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = 'Check in load';
  sheet.appendChild(title);

  const form = document.createElement('div');
  form.innerHTML = `
    <p class="note-text" style="margin-bottom:14px;">Confirming <strong>${odt.id}</strong> (${odt.boxes.reduce((s,b)=>s+b.qty,0)} boxes) is loaded for delivery to <strong>${storeLabelFromCode(odt.destinationStore)}</strong>.</p>
    <label class="field-label">Vehicle / plate</label>
    <input type="text" id="vehicleId" placeholder="e.g. Van 3 — 4521 GLM" />
    <button class="btn btn-stamp" id="confirmLoadBtn">Confirm loaded on vehicle</button>
  `;
  sheet.appendChild(form);

  form.querySelector('#confirmLoadBtn').addEventListener('click', async ()=>{
    const btn = form.querySelector('#confirmLoadBtn');
    btn.disabled=true; btn.innerHTML = '<span class="spinner"></span> Saving…';
    odt.status = 'loaded';
    odt.loadedBy = state.userName;
    odt.loadedAt = Date.now();
    odt.vehicleId = form.querySelector('#vehicleId').value.trim() || null;
    const ok = await saveODT(odt);
    if(!ok){
      btn.disabled = false;
      btn.innerHTML = 'Confirm loaded on vehicle';
      showToast('Save failed: ' + (lastDbError || 'could not reach the database'));
      return;
    }
    state.modal = null;
    showToast(`${odt.id} checked in as loaded`);
    render();
  });
}

// --- Scan modal (Driver) — camera barcode/QR scan with manual fallback ---
function renderScanModal(sheet){
  const title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = 'Scan ODT code';
  sheet.appendChild(title);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="scan-video-wrap" id="scanVideoWrap">
      <video id="scanVideo" playsinline autoplay muted></video>
      <div class="scan-frame"></div>
    </div>
    <p class="note-text" id="scanStatus" style="text-align:center;margin-top:10px;">Point your camera at the ODT barcode or QR code.</p>
    <label class="field-label" style="margin-top:18px;">Or enter the code manually</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="manualCode" class="mono" placeholder="ODT number" autocapitalize="characters" style="flex:1;" />
      <button class="btn btn-outline btn-sm" id="manualCodeBtn" style="width:auto;">Go</button>
    </div>
  `;
  sheet.appendChild(wrap);

  const statusEl = wrap.querySelector('#scanStatus');
  const videoWrap = wrap.querySelector('#scanVideoWrap');
  const video = wrap.querySelector('#scanVideo');

  function handleCode(raw){
    const code = (raw || '').trim();
    if(!code) return;
    const odt = state.odts.find(o => o.id.toLowerCase() === code.toLowerCase());
    stopScanStream();
    if(!odt){
      state.modal = null;
      showToast('No ODT matches that code');
      render();
      return;
    }
    state.activeOdtId = odt.id;
    state.screen = 'odt_detail';
    if(odt.status === 'created'){
      state.modal = {type:'load', odtId: odt.id};
    } else if(odt.status === 'loaded'){
      state.modal = {type:'deliver', odtId: odt.id};
    } else {
      state.modal = null;
    }
    render();
  }

  wrap.querySelector('#manualCodeBtn').addEventListener('click', ()=> handleCode(wrap.querySelector('#manualCode').value));
  wrap.querySelector('#manualCode').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleCode(e.target.value); });

  if(!('BarcodeDetector' in window)){
    statusEl.textContent = "Camera scanning isn't available in this browser — enter the code manually below.";
    videoWrap.style.display = 'none';
    return;
  }

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(stream=>{
      // If the modal got closed while the camera permission prompt was
      // still up, don't hang on to a stream nobody will stop.
      if(!(state.modal && state.modal.type === 'scan')){
        stream.getTracks().forEach(t=>t.stop());
        return;
      }
      activeScanStream = stream;
      video.srcObject = stream;
      let detector;
      try{
        detector = new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a']});
      }catch(e){
        detector = new BarcodeDetector();
      }
      async function tick(){
        if(!activeScanStream) return; // stream was stopped elsewhere — halt the loop
        try{
          const codes = await detector.detect(video);
          if(codes && codes.length){
            handleCode(codes[0].rawValue);
            return;
          }
        }catch(e){ /* ignore transient per-frame detection errors */ }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })
    .catch(()=>{
      statusEl.textContent = "Couldn't access the camera — enter the code manually below.";
      videoWrap.style.display = 'none';
    });
}

// --- Deliver / receive modal (Store / Driver) — signature + photo ---
function renderDeliverModal(sheet){
  const odt = state.odts.find(o=>o.id===state.modal.odtId);
  const title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = 'Confirm receipt';
  sheet.appendChild(title);

  const form = document.createElement('div');
  form.innerHTML = `
    <p class="note-text" style="margin-bottom:14px;">Receiving <strong>${odt.id}</strong> — ${odt.boxes.reduce((s,b)=>s+b.qty,0)} boxes from ${odt.originLabel}. You'll be able to check the products against the manifest and report any issues right after this.</p>

    <label class="field-label">Your name</label>
    <input type="text" id="deliverByInput" value="${escapeHtml(state.userName)}" placeholder="Who is confirming this?" />

    <label class="field-label" style="margin-top:14px;">Photo of received boxes</label>
    <div class="file-input-wrap" id="photoWrap">
      <span class="ficon">📷</span>
      <span id="photoPrompt">Tap to take or upload a photo</span>
      <input type="file" accept="image/*" capture="environment" id="photoInput" />
    </div>
    <img id="photoPreview" style="display:none;width:100%;border-radius:8px;margin-top:10px;" />

    <label class="field-label" style="margin-top:18px;">Signature</label>
    <canvas id="sigCanvas"></canvas>
    <button class="btn btn-ghost btn-sm" id="clearSigBtn" style="width:auto;margin-top:8px;">Clear signature</button>

    <button class="btn btn-green" id="submitReceiptBtn" style="margin-top:18px;">Sign &amp; confirm receipt</button>
  `;
  sheet.appendChild(form);

  let photoData = null;

  const photoInput = form.querySelector('#photoInput');
  form.querySelector('#photoWrap').addEventListener('click', ()=> photoInput.click());
  photoInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    form.querySelector('#photoPrompt').textContent = 'Processing photo…';
    try{
      photoData = await compressImageToFit(file, 350000);
      const prev = form.querySelector('#photoPreview');
      prev.src = photoData;
      prev.style.display = 'block';
      form.querySelector('#photoPrompt').textContent = 'Photo captured — tap to retake';
    }catch(err){
      showToast('Could not process that photo, please try another');
      form.querySelector('#photoPrompt').textContent = 'Tap to take or upload a photo';
    }
  });

  // Signature canvas setup
  const canvas = form.querySelector('#sigCanvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2,2);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1A1D29';
  }
  setTimeout(resizeCanvas, 0);

  let drawing = false, lastX=0, lastY=0, hasDrawn=false;
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX-rect.left, y: t.clientY-rect.top};
  }
  function start(e){ e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    lastX=p.x; lastY=p.y;
    hasDrawn = true;
  }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  canvas.addEventListener('touchend', end);

  form.querySelector('#clearSigBtn').addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasDrawn = false;
  });

  form.querySelector('#deliverByInput').addEventListener('input', (e)=> e.target.classList.remove('input-error'));

  form.querySelector('#submitReceiptBtn').addEventListener('click', async ()=>{
    const deliverByName = form.querySelector('#deliverByInput').value.trim();
    if(!deliverByName){
      form.querySelector('#deliverByInput').classList.add('input-error');
      showToast('Enter who is confirming this delivery');
      return;
    }
    if(!hasDrawn){ showToast('Please sign before confirming'); return; }
    const btn = form.querySelector('#submitReceiptBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving…';

    odt.status = 'delivered';
    odt.deliveredBy = deliverByName;
    odt.deliveredAt = Date.now();
    odt.signatureData = canvas.toDataURL('image/png');
    odt.photoData = photoData;
    odt.deliveryNote = null;

    const ok = await saveODT(odt);
    if(!ok){
      btn.disabled = false;
      btn.innerHTML = 'Sign &amp; confirm receipt';
      showToast('Save failed: ' + (lastDbError || 'could not reach the database'));
      return;
    }
    state.modal = null;
    showToast(`${odt.id} marked as received`);
    if(state.role === 'store' && state.userName !== deliverByName){
      state.userName = deliverByName;
      saveSession();
    }
    render();
  });
}

init();
})();
</script>
